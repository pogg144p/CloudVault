services:
  # ─── 1. PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    container_name: cloudvault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudvault
      POSTGRES_PASSWORD: cloudvault_password
      POSTGRES_DB: cloudvault_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudvault -d cloudvault_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── 2. Redis In-Memory Cache & Message Broker ───
  redis:
    image: redis:7-alpine
    container_name: cloudvault-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ─── 3. FastAPI Backend Service ───
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cloudvault-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgresql+asyncpg://cloudvault:cloudvault_password@postgres:5432/cloudvault_db"
      SECRET_KEY: "cloudvault-devops-secret-key-change-in-prod"
      STORAGE_BACKEND: "local"
      LOCAL_STORAGE_DIR: "/app/storage_data"
      REDIS_URL: "redis://redis:6379/0"
      BACKEND_CORS_ORIGINS: "http://localhost:3000,http://localhost:5173,http://localhost:80"
    ports:
      - "8000:8000"
    volumes:
      - backend_storage:/app/storage_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/dashboard/stats"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── 5. React Frontend (Nginx SPA) ───
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cloudvault-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

  # ─── 6. Prometheus SRE Telemetry Scraper ───
  prometheus:
    image: prom/prometheus:v2.50.0
    container_name: cloudvault-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - backend

  # ─── 7. Grafana Observability Dashboards ───
  grafana:
    image: grafana/grafana:10.3.3
    container_name: cloudvault-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  backend_storage:
  prometheus_data:
  grafana_data: