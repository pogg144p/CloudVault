global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'cloudvault-unified-telemetry'

rule_files:
  - "alerts.yml"

scrape_configs:
  # ─── 1. Local CloudVault FastAPI Backend ───
  - job_name: 'cloudvault-backend-local'
    scrape_interval: 10s
    metrics_path: '/metrics'
    static_configs:
      - targets: ['backend:8000', 'localhost:8000']
        labels:
          environment: 'local'
          provider: 'docker'

  # ─── 2. Render Cloud Production Backend (Live Remote Scrape) ───
  - job_name: 'cloudvault-backend-render-cloud'
    scrape_interval: 30s
    scrape_timeout: 15s
    scheme: https
    metrics_path: '/metrics'
    static_configs:
      - targets: ['cloudvault-backend-cazy.onrender.com']
        labels:
          environment: 'production'
          provider: 'render'

  # ─── 3. Local Redis Cache & Broker ───
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'cache'

  # ─── 4. Prometheus Self-Telemetry ───
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
