apiVersion: v1
kind: Secret
metadata:
  name: {{ include "cloudvault.fullname" . }}-secrets
  labels:
    {{- include "cloudvault.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ .Values.backend.secretEnv.SECRET_KEY | quote }}
  DATABASE_URL: {{ .Values.backend.secretEnv.DATABASE_URL | quote }}
  S3_ACCESS_KEY: {{ .Values.backend.secretEnv.S3_ACCESS_KEY | quote }}
  S3_SECRET_KEY: {{ .Values.backend.secretEnv.S3_SECRET_KEY | quote }}
