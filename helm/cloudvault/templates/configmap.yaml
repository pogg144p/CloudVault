apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cloudvault.fullname" . }}-config
  labels:
    {{- include "cloudvault.labels" . | nindent 4 }}
data:
  ENVIRONMENT: {{ .Values.global.environment | quote }}
  STORAGE_BACKEND: {{ .Values.backend.env.STORAGE_BACKEND | quote }}
  S3_ENDPOINT_URL: {{ .Values.backend.env.S3_ENDPOINT_URL | quote }}
  S3_BUCKET_NAME: {{ .Values.backend.env.S3_BUCKET_NAME | quote }}
  S3_REGION: {{ .Values.backend.env.S3_REGION | quote }}
  S3_SECURE: {{ .Values.backend.env.S3_SECURE | quote }}
  DEFAULT_STORAGE_QUOTA_BYTES: {{ .Values.backend.env.DEFAULT_STORAGE_QUOTA_BYTES | quote }}
  BACKEND_CORS_ORIGINS: "https://{{ .Values.global.domain }},http://localhost:3000,http://localhost:5173"
