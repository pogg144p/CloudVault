services:
  db:
    image: postgres:16-alpine
    container_name: cloudvault-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cloudvault
      POSTGRES_PASSWORD: cloudvault_password
      POSTGRES_DB: cloudvault_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudvault -d cloudvault_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: cloudvault-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cloudvault-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: "postgresql+asyncpg://cloudvault:cloudvault_password@db:5432/cloudvault_db"
      SECRET_KEY: "cloudvault-production-secret-key-change-me"
      STORAGE_BACKEND: "local"
      LOCAL_STORAGE_DIR: "/app/storage_data"
      DEFAULT_STORAGE_QUOTA_BYTES: 10737418240
    volumes:
      - backend_storage:/app/storage_data
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cloudvault-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  minio_data:
  backend_storage:
